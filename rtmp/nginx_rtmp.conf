# Nginx RTMP Configuration for Multi-Camera Bowling Setup
# Supports multiple simultaneous RTMP streams

worker_processes 2;  # Increased for better concurrency

error_log off;
#pid nginx-rtmp/logs/nginx.pid;

events {
    worker_connections 2048;  # Increased for multiple streams
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        # Main live application - supports multiple streams
        application live {
            live on;
            record off;
            allow publish all;
            allow play all;
        }

        # Separate applications for different camera types (optional)
        application lane {
            live on;
            record off;
            allow publish all;
            allow play all;
        }

        application side {
            live on;
            record off;
            allow publish all;
            allow play all;
        }

        application behind {
            live on;
            record off;
            allow publish all;
            allow play all;
        }

        # HLS streaming for web playback
        application hls {
            live on;
            hls on;
            hls_path temp/hls;
            hls_fragment 3s;
            hls_playlist_length 60s;
            hls_cleanup on;
        }
    }
}

http {
    access_log logs/access.log;
    client_body_temp_path temp/client_body_temp;
    proxy_temp_path temp/proxy_temp;
    fastcgi_temp_path temp/fastcgi_temp;
    scgi_temp_path temp/scgi_temp;
    uwsgi_temp_path temp/uwsgi_temp;

    server {
        listen 8080;

        # RTMP statistics
        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
        }

        location /stat.xsl {
            root html;
        }

        # HLS streaming
        location /hls {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            root temp;
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin *;
        }

        # Basic status page
        location / {
            return 200 "Multi-Camera RTMP Server Running\n\nStream URLs:\n- rtmp://localhost/live/stream\n- rtmp://localhost/lane/stream\n- rtmp://localhost/side/stream\n- rtmp://localhost/behind/stream\n\nHLS: http://localhost:8080/hls/stream.m3u8\nStats: http://localhost:8080/stat";
            add_header Content-Type text/plain;
        }
    }
}