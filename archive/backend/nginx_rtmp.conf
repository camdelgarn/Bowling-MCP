# Nginx RTMP Configuration for GoPro Streaming
# Save this as nginx_rtmp.conf in your project directory

worker_processes 1;

error_log off;
#pid nginx-rtmp/logs/nginx.pid;

events {
    worker_connections 1024;
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application live {
            live on;
            record off;

            # Allow publishing from GoPro
            allow publish all;
            allow play all;

            # Optional: record streams to disk
            # record all;
            # record_path /tmp/rec;
            # record_unique on;
        }

        # HLS streaming for web playback
        application hls {
            live on;
            hls on;
            hls_path nginx-rtmp/temp/hls;
            hls_fragment 3s;
            hls_playlist_length 60s;
            hls_cleanup on;
        }
    }
}

http {
    access_log nginx-rtmp/logs/access.log;
    client_body_temp_path nginx-rtmp/temp/client_body_temp;
    proxy_temp_path nginx-rtmp/temp/proxy_temp;
    fastcgi_temp_path nginx-rtmp/temp/fastcgi_temp;
    scgi_temp_path nginx-rtmp/temp/scgi_temp;
    uwsgi_temp_path nginx-rtmp/temp/uwsgi_temp;

    server {
        listen 8080;

        # RTMP statistics
        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
        }

        location /stat.xsl {
            root nginx-rtmp/html;
        }

        # HLS streaming
        location /hls {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            root nginx-rtmp/temp;
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin *;
        }

        # Basic status page
        location / {
            return 200 "GoPro RTMP Server Running\nRTMP: rtmp://localhost/live/stream\nHLS: http://localhost:8080/hls/stream.m3u8\nStats: http://localhost:8080/stat";
            add_header Content-Type text/plain;
        }
    }
}